<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内部信息平台 - 狰州市公安局</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-box">
    <div class="login-hd">狰州市公安局　内部信息平台</div>
    <div class="login-bd">
      <div id="err" class="err" style="display:none;">该账号已停用，请联系管理员</div>
      <form id="f" onsubmit="return false">
        <label for="user">警　　号</label>
        <input id="user" type="text" autocomplete="off" maxlength="10">
        <label for="pass">密　　码</label>
        <input id="pass" type="password" autocomplete="off" maxlength="20">
        <button id="btn" type="submit">登 录</button>
      </form>
      <div class="login-tip">本系统仅限在职民警使用，操作留痕。</div>
      <div class="login-tip">忘记密码？请联系档案室内线 8041。</div>
    </div>
  </div>
</div>

<script>
(function () {
  var U = String.fromCharCode(48, 52, 49, 55);
  var PS = [
    String.fromCharCode(48, 56, 49, 55),
    String.fromCharCode(56, 49, 55),
    String.fromCharCode(50, 48, 50, 50, 48, 56, 49, 55)
  ];
  var f = document.getElementById('f');
  var u = document.getElementById('user');
  var p = document.getElementById('pass');
  var err = document.getElementById('err');
  var btn = document.getElementById('btn');

  f.addEventListener('submit', function () {
    btn.disabled = true;
    var uv = u.value.trim();
    var pv = p.value.trim();
    if (uv === U && PS.indexOf(pv) > -1) {
      location.href = '/archive/index.html';
      return;
    }
    err.style.display = 'block';
    btn.disabled = false;
  });
})();
</script>

</body>
</html>
