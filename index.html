<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARG for Novel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <p class="tag">SIGNAL // 001</p>
    <h1>ARG for Novel</h1>
    <p class="lede">一个尚在计划中的 ARG 项目。本页仅用于验证仓库连通与部署链路。</p>

    <section class="panel">
      <div class="row">
        <span class="key">仓库</span>
        <span class="val">Huntwolf491001 / ARG-for-novel</span>
      </div>
      <div class="row">
        <span class="key">分支</span>
        <span class="val">main</span>
      </div>
      <div class="row">
        <span class="key">本地时间</span>
        <span class="val" id="clock">--:--:--</span>
      </div>
      <div class="row">
        <span class="key">链路状态</span>
        <span class="val ok" id="status">检测中</span>
      </div>
    </section>

    <footer>
      <span id="note">页面已加载</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
