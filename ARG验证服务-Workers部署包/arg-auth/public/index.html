<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARG 验证服务 · 管理后台</title><link rel="stylesheet" href="/style.css"></head><body>
<header><h1>ARG 验证服务</h1><p>站点接入与账号管理</p></header><main>
<p id="message" role="status" aria-live="polite"></p>
<section class="card" id="login"><h2>管理员登录</h2><form id="login-form"><label>管理员账号<input name="username" autocomplete="username" required></label><label>管理员密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></section>
<div id="dashboard" hidden><div class="topline"><p>在此登记站点、设置玩家账号，并查看最近的验证记录。</p><button class="secondary" id="logout">退出登录</button></div><div class="grid">
<section class="card"><h2>登记站点</h2><form id="site-form"><label>站点 ID（小写字母、数字、连字符）<input name="id" placeholder="police" required></label><label>站点名称<input name="name" placeholder="市局官网" required></label><label>目标站点地址（HTTPS，不含路径）<input name="origin" placeholder="https://example.workers.dev" required></label><label>受保护目录<input name="prefix" value="/archive/" required></label><label>验证成功后跳转路径<input name="destination" value="/archive/index.html" required></label><button>登记站点</button></form></section>
<section class="card"><h2>设置玩家账号</h2><p>同一站点下再次提交相同账号会更新密码。</p><form id="account-form"><label>站点<select name="site" id="account-site" required></select></label><label>玩家账号<input name="username" required autocomplete="off"></label><label>玩家密码<input name="password" type="password" required autocomplete="new-password"></label><button>保存账号</button></form></section>
<section class="card wide"><h2>站点及接入配置</h2><p>选择已登记的站点，复制配置到目标站点 Worker。签名密钥是敏感信息，只能放入目标 Worker 的 Secret。</p><label>选择站点<select id="site-select"></select></label><pre id="integration">尚无站点。</pre></section>
<section class="card wide"><div class="topline"><h2>最近验证记录</h2><button id="refresh" class="secondary">刷新</button></div><div class="scroll"><table><thead><tr><th>时间</th><th>站点 ID</th><th>账号</th><th>结果</th><th>目标页面（通过时）</th></tr></thead><tbody id="events"></tbody></table></div></section>
</div></div></main><script type="module" src="/admin.js"></script></body></html>
