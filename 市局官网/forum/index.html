<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>狰州民间消息论坛</title>
<meta name="robots" content="noindex,nofollow">
<style>
  body {
    margin: 0;
    background: #e8e8e8;
    font-family: "SimSun", "宋体", serif;
    font-size: 13px;
    color: #333;
  }
  .box {
    width: 520px;
    margin: 90px auto 0;
    background: #fff;
    border: 1px solid #b5b5b5;
  }
  .hd {
    background: #1e4d8c;
    color: #fff;
    padding: 8px 14px;
    font-family: "Microsoft YaHei", sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .bd {
    padding: 28px 24px 30px;
    line-height: 2;
  }
  .bd p {
    margin: 0 0 6px;
  }
  .tip {
    color: #999;
    font-size: 12px;
    margin-top: 18px;
    border-top: 1px dashed #ddd;
    padding-top: 12px;
  }
  .ft {
    background: #f5f5f5;
    border-top: 1px solid #ddd;
    padding: 8px 14px;
    font-size: 12px;
    color: #888;
    text-align: center;
  }
  @media (max-width: 820px) {
    .box {
      width: 92%;
      margin: 40px auto 0;
    }
    .bd {
      padding: 20px 16px 22px;
    }
  }
</style>
</head>
<body>

<div class="box">
  <div class="hd">狰州民间消息论坛</div>
  <div class="bd">
    <p>因服务器迁移，本站暂停访问。</p>
    <p>恢复时间另行通知。</p>
    <div class="tip">
      如有疑问请联系管理员。<br>
      本站创建于 2015 年 3 月。
    </div>
  </div>
  <div class="ft">Powered by Discuz! X3.2</div>
</div>

</body>
</html>
